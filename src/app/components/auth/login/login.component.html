<section class="auth">
  <div class="auth__card">
    <div class="auth__head">
      <div class="auth__logo">R</div>
      <div>
        <div class="auth__title">Giriş</div>
        <div class="auth__sub">Hesabına erişmek için bilgilerini gir</div>
      </div>
    </div>

    <form class="auth__form">
      <label class="field">
        <span>E-posta</span>
        <input type="email" placeholder="ornek@mail.com">
      </label>

      <label class="field">
        <span>Parola</span>
        <input type="password" placeholder="••••••••">
      </label>

      <button class="btn btn--primary" type="button">Giriş Yap</button>

      <div class="auth__links">
  <a href="/register">Hesabın yok mu? Kayıt Ol</a>
  <a href="/reset-password" class="muted">Şifremi unuttum</a>
</div>
    </form>
  </div>
</section>
