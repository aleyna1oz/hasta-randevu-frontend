<section class="auth">
  <div class="auth__card">
    <div class="auth__head">
      <div class="auth__logo">R</div>
      <div>
        <div class="auth__title">Şifre Sıfırlama</div>
        <div class="auth__sub">E-postanı gir, sıfırlama bağlantısı gönderelim</div>
      </div>
    </div>

    <form class="auth__form">
      <label class="field">
        <span>E-posta</span>
        <input type="email" placeholder="ornek@mail.com">
      </label>

      <button class="btn btn--primary" type="button">Sıfırlama Bağlantısı Gönder</button>

      <div class="auth__links">
        <a routerLink="/login">Giriş ekranına dön</a>
      </div>
    </form>
  </div>
</section>
