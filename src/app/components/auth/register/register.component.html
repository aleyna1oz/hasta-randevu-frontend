<section class="auth">
  <div class="auth__card">
    <div class="auth__head">
      <div class="auth__logo">R</div>
      <div>
        <div class="auth__title">Kayıt Ol</div>
        <div class="auth__sub">Yeni hesap oluştur</div>
      </div>
    </div>

    <form class="auth__form">
      <div class="grid">
        <label class="field">
          <span>Ad</span>
          <input type="text" placeholder="Ad">
        </label>

        <label class="field">
          <span>Soyad</span>
          <input type="text" placeholder="Soyad">
        </label>
      </div>

      <label class="field">
        <span>E-posta</span>
        <input type="email" placeholder="ornek@mail.com">
      </label>

      <div class="grid">
        <label class="field">
          <span>Parola</span>
          <input type="password" placeholder="••••••••">
        </label>

        <label class="field">
          <span>Parola (Tekrar)</span>
          <input type="password" placeholder="••••••••">
        </label>
      </div>

      <button class="btn btn--primary" type="button">Hesap Oluştur</button>

      <div class="auth__links">
        <a routerLink="/login">Zaten hesabın var mı? Giriş Yap</a>
      </div>
    </form>
  </div>
</section>
